name: test install

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run:
    name: Install ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ github.actor == 'dependabot[bot]' && fromJSON('[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04"}]') || fromJSON('[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04"},{"target":"x86_64-pc-windows-msvc","os":"windows-2022"},{"target":"aarch64-apple-darwin","os":"macos-15"},{"target":"x86_64-apple-darwin","os":"macos-15"}]') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        uses: ./
        with:
          version: 'latest'

      - name: Verify
        run: hatch --version
