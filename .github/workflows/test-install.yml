name: test install

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run:
    name: Install ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ github.actor == 'dependabot[bot]' && fromJSON('[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04"}]') || fromJSON('[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04"},{"target":"x86_64-pc-windows-msvc","os":"windows-2022"},{"target":"aarch64-apple-darwin","os":"macos-15"},{"target":"x86_64-apple-darwin","os":"macos-15"}]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install
        uses: ./
        with:
          version: 'latest'

      - name: Verify
        run: hatch --version
